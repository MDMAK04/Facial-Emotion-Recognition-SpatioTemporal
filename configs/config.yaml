dataset:
  raw_dir: "data/ravdess"
  cache_dir: "data/processed"
  train_actors_max: 19       # Acteurs 01-19 (Train) | Acteurs 20-24 (Val)
  img_size: [128, 128]
  ssim_threshold: 0.90
  target_frames: 16
  crop_face: true

spatial:
  backbone: "vgg16"
  feature_dim: 512
  num_classes: 8
  freeze_early_layers: true
  batch_size: 64
  epochs: 15
  lr: 0.0001
  weight_decay: 0.0001

temporal:
  hidden_dim: 128
  num_layers: 2
  dropout: 0.3
  batch_size: 32
  epochs: 30
  lr: 0.001
  models: ["rnn", "lstm", "gru", "transformer"]
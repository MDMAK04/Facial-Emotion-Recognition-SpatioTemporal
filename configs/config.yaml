dataset:
  train_actors_max: 19       # Acteurs 01-19 Train (80%), Acteurs 20-24 Val/Test (20%)
  img_size: [128, 128]
  num_classes: 8

keyframe_selection:
  ssim_threshold: 0.90       # Élimine les frames consécutives trop similaires
  target_frames: 16          # Longueur fixe T de la séquence vidéo
  crop_face: true

spatial_model:
  backbone: "vgg16"          
  feature_dim: 512
  batch_size: 32
  epochs: 20
  learning_rate: 0.0001

sequence_models:
  architectures: ["rnn", "lstm", "gru", "transformer"]
  hidden_dim: 128
  num_layers: 2
  dropout: 0.3
  batch_size: 32
  epochs: 40
  learning_rate: 0.0005